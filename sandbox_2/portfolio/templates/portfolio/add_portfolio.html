<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background-color: #000;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .form-container {
      width: 100%;
      max-width: 600px;
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      text-align: center;
      color: #0abf53;
      margin-bottom: 0.3rem;
    }

    .form-description {
      text-align: center;
      color: #6c757d;
      margin-bottom: 1.25rem;
      font-size: 0.95rem;
    }

    form p {
      margin-bottom: 1.2rem;
    }

    form p label {
      font-weight: 500;
      display: block;
      margin-bottom: 0.35rem;
      color: #333;
    }

    form p input,
    form p select,
    form p textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ced4da;
      border-radius: 8px;
      font-size: 1rem;
    }

    form p input:focus,
    form p select:focus,
    form p textarea:focus {
      border-color: #0abf53;
      outline: none;
      box-shadow: 0 0 0 0.2rem rgba(10, 191, 83, 0.25);
    }

    .btn-submit {
      display: block;
      width: 100%;
      background-color: #0abf53;
      color: white;
      padding: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #099548;
    }

    @media (max-width: 576px) {
      .form-container {
        padding: 1.5rem 1rem;
        border-radius: 12px;
      }

      h1 {
        font-size: 1.4rem;
      }

      .form-description {
        font-size: 0.88rem;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="form-container">
      <h1>Add Portfolio</h1>
      <p class="form-description">
        Create a new investment portfolio by entering relevant details. You can manage and analyze it later from your dashboard.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Add</button>
      </form>
    </div>
  </div>
</body>
</html>
