{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sustains.ai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/login.css' %}?v={{ timestamp }}">
    <link rel="stylesheet" href="{% static 'css/outofthedark.css' %}">
</head>
<body>
    <div class="container-fluid">
        <div class="row h-100">
            <div class="col-lg-6 split left">
                <div class="form-container">
                    <div class="logo-container">
                        <img src="{% static 'portfolio/sustain_black.png' %}" alt="Sustains.ai Logo" class="logo">
                    </div>
                    <h2 class="text-center">Sign In</h2>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-2">
                            <label class="label" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
                            <div class="form-floating">
                                <div class="input-wrapper">
                                    <input type="text" name="{{ form.username.html_name }}" class="form-control" id="{{ form.username.id_for_label }}" placeholder="Username" required>
                                </div>
                            </div>
                            {% if form.username.errors %}
                                <div class="text-danger mt-2 small">{{ form.username.errors }}</div>
                            {% endif %}
                        </div>

                        <div class="mb-2">
                            <label class="label" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
                            <div class="form-floating">
                                <div class="input-wrapper">
                                    <input type="password" name="{{ form.password.html_name }}" class="form-control" id="{{ form.password.id_for_label }}" placeholder="Password" required>
                                </div>
                            </div>
                            {% if form.password.errors %}
                                <div class="text-danger mt-2 small">{{ form.password.errors }}</div>
                            {% endif %}
                        </div>

                        <button type="submit" class="btn btn-success btn-login w-100 mt-4">
                            <i class="fas fa-sign-in-alt me-2"></i> Login
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-6 split right">
                <div class="cards-container"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/outofthedark.js' %}"></script>
</body>
</html>
