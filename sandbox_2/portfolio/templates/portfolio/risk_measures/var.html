<h3>Value at Risk (VaR) - 95% Confidence</h3>
<table class="table table-bordered">
    <thead>
        <tr>
            <th>Stock Symbol</th>
            <th>VaR (95%)</th>
        </tr>
    </thead>
    <tbody>
        {% for symbol, var in var_data.items %}
        <tr>
            <td>{{ symbol }}</td>
            <td>{{ var|floatformat:4 }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
