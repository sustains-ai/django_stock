{% extends 'portfolio/base.html' %}

{% block title %}Your Portfolios{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-success text-white text-center">
        <h2>Your Portfolios</h2>
    </div>
    <div class="card-body">
        <ul class="list-group mb-3">
            {% for portfolio in portfolios %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>{{ portfolio.name }}</span>
                <div>
                    <a href="{% url 'analyze_portfolio' portfolio.id %}" class="btn btn-primary btn-sm me-2">
                        Analyze
                    </a>
                    <form action="{% url 'delete_portfolio' portfolio.id %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-sm">
                            Delete
                        </button>
                    </form>
                </div>
            </li>
            {% endfor %}
        </ul>
        <div class="d-flex justify-content-between">
            <a href="{% url 'add_portfolio' %}" class="btn btn-success">Add Portfolio</a>
            <a href="{% url 'add_stock' %}" class="btn btn-secondary">Add Stock</a>
        </div>
    </div>
</div>
{% endblock %}
