{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio Manager{% endblock %}</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/modern-light.css' %}" id="theme-css">
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <a href="{% url 'portfolio_list' %}" class="sidebar-logo">
                    <i class="fas fa-chart-line"></i>
                    Portfolio Manager
                </a>
            </div>
            
            <ul class="sidebar-nav">
                <li>
                    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                        <i class="fas fa-tachometer-alt"></i>
                        Dashboard
                    </a>
                </li>
                <li>
                    <a href="{% url 'portfolio_list' %}" class="{% if request.resolver_match.url_name == 'portfolio_list' %}active{% endif %}">
                        <i class="fas fa-briefcase"></i>
                        Portfolios
                    </a>
                </li>
                <li>
                    <a href="{% url 'analytics' %}" class="{% if request.resolver_match.url_name == 'analytics' %}active{% endif %}">
                        <i class="fas fa-chart-bar"></i>
                        Analytics
                    </a>
                </li>
                <li>
                    <a href="{% url 'risk' %}" class="{% if request.resolver_match.url_name == 'risk' %}active{% endif %}">
                        <i class="fas fa-shield-alt"></i>
                        Risk Analysis
                    </a>
                </li>
                <li>
                    <a href="{% url 'settings' %}" class="{% if request.resolver_match.url_name == 'settings' %}active{% endif %}">
                        <i class="fas fa-cog"></i>
                        Settings
                    </a>
                </li>
            </ul>
            
            <div style="margin-top: auto; padding-top: 2rem;">
                <a href="{% url 'logout' %}" class="sidebar-nav a">
                    <i class="fas fa-sign-out-alt"></i>
                    Logout
                </a>
            </div>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
    
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme Initialization Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const themeCSS = document.getElementById('theme-css');
            const currentTheme = localStorage.getItem('theme') || 'light';
            
            // Apply the saved theme on page load
            if (currentTheme === 'dark') {
                themeCSS.href = '{% static "css/modern-dark.css" %}';
                // Force reload to ensure dark theme is applied
                setTimeout(() => {
                    themeCSS.href = '{% static "css/modern-dark.css" %}?v=' + Date.now();
                }, 100);
            } else {
                themeCSS.href = '{% static "css/modern-light.css" %}';
            }
        });
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
