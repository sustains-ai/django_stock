{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}sustains.ai{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <style>
        /* Custom Styles */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }
        main.container {
            flex: 1;
        }
        footer {
            margin-top: auto;
            background-color: #0ABF53;
            color: #fff;
        }
        .navbar-custom {
            background-color: #0ABF53; /* Navbar background color */
            color: #ffffff;
        }
        .navbar-custom .nav-link {
            color: #ffffff !important; /* Ensure link text color */
        }
        .navbar-custom .nav-link:hover {
            text-decoration: underline;
            color: #d4d4d4 !important; /* Link hover color */
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">sustains.ai</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'portfolio_list' %}">Your portfolio</a></li>
<!--                    <li class="nav-item"><a class="nav-link" href="{% url 'add_portfolio' %}">Add Portfolio</a></li>-->
<!--                    <li class="nav-item"><a class="nav-link" href="{% url 'add_stock' %}">Add Stock</a></li>-->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="text-center py-3">
        <p>&copy; 2025 <strong>sustains.ai</strong> | Empowering Risk Analytics</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
